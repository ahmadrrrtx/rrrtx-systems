name: Production quality gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TURSO_DATABASE_URL: file:ci.db
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ci-password-123456
      ADMIN_SESSION_SECRET: ci-session-secret-123456789012345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Create isolated CI schema
        run: npx drizzle-kit push --force
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
